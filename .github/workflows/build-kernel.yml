name: Build Xiaomi 14 (houji) GKI 6.1 with LZ4KD

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: 安装基础编译依赖与 Clang 17 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev git curl zip unzip python3 gcc-aarch64-linux-gnu dwarves

          # 安装并链接 Clang 17
          if ! sudo apt-get install -y clang-17 lld-17 llvm-17; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 17
            sudo apt-get install -y lld-17 llvm-17
          fi

          sudo ln -sf $(which clang-17) /usr/bin/clang
          sudo ln -sf $(which ld.lld-17) /usr/bin/ld.lld
          sudo ln -sf $(which llvm-ar-17) /usr/bin/llvm-ar
          sudo ln -sf $(which llvm-nm-17) /usr/bin/llvm-nm
          sudo ln -sf $(which llvm-objcopy-17) /usr/bin/llvm-objcopy
          sudo ln -sf $(which llvm-strip-17) /usr/bin/llvm-strip

          clang --version

      - name: 拉取 AOSP GKI 6.1 内核源码 (精确锁定 6.1.138 原厂 commit)
        run: |
          echo "Cloning AOSP android14-6.1 at exact commit 0c3d559bcd85..."
          mkdir common && cd common
          git init
          git remote add origin https://android.googlesource.com/kernel/common.git
          git fetch --depth=1 origin 0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
          git checkout FETCH_HEAD
          cd ..

      - name: 注入 LZ4KD 源码与驱动补丁
        run: |
          echo "Injecting LZ4K and LZ4KD source files..."
          cp -rf lz4k_src/include/linux/* common/include/linux/
          cp -rf lz4k_src/lib/* common/lib/
          cp -rf lz4k_src/crypto/* common/crypto/

          echo "Applying LZ4KD patches via python injector..."
          python3 apply_lz4kd.py

      - name: 配置 GKI 内核开关并启用 LZ4KD
        run: |
          cd common
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          # 确保 ZRAM 编入核心内核 Image
          sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' "$CONFIG_FILE" 

          echo "CONFIG_LZ4K_COMPRESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_LZ4K_DECOMPRESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_LZ4KD_COMPRESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_LZ4KD_DECOMPRESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
          echo 'CONFIG_LOCALVERSION="-android14-11"' >> "$CONFIG_FILE" 
          echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
          echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
          echo "CONFIG_DEBUG_INFO_BTF=n" >> "$CONFIG_FILE"
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG_FILE" 

          echo "Kernel defconfig updated successfully."
          cd ..

      - name: 编译 GKI 内核 (Image)
        run: |
          cd common
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          echo "Generating defconfig..."
          make -j$(nproc) gki_defconfig

          # 精确设置版本后缀，匹配系统内 493 个外置驱动的 vermagic
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11"/g' .config || true

          echo "Starting kernel compilation..."
          make -j$(nproc) LOCALVERSION="-android14-11" Image

          ls -lh arch/arm64/boot/Image
          cd ..

      - name: 打包 AnyKernel3 刷机包 (仅限小米14 houji GKI 2.0 规范)
        run: |
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
          cd anykernel

          cat << 'AKEOF' > anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers & GKI 2.0
properties() { '
kernel.string=Xiaomi 14 (houji) GKI 6.1 with LZ4KD
do.devicecheck=1
do.modules=0
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
device.name1=houji
'; }

block=boot;
is_slot_device=auto;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;
no_magisk_check=1;

. tools/ak3-core.sh;

split_boot;

if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
    unpack_ramdisk;
    write_boot;
else
    flash_boot;
fi;
AKEOF

          cp ../common/arch/arm64/boot/Image ./Image
          zip -r9 ../AnyKernel3-Xiaomi14-houji-LZ4KD.zip * -x .git* -x README.md
          cd ..
          ls -lh AnyKernel3-Xiaomi14-houji-LZ4KD.zip

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi14-houji-LZ4KD-Kernel
          path: |
            AnyKernel3-Xiaomi14-houji-LZ4KD.zip
            common/arch/arm64/boot/Image

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: GKI-6.1-LZ4KD-${{ github.run_number }}
          name: Xiaomi 14 (houji) GKI 6.1 LZ4KD Build #${{ github.run_number }}
          body: |
            ## 小米 14 (houji 专用) GKI 6.1 + LZ4KD 内核

            - **目标机型**：仅限小米 14 (houji)
            - **系统版本**：澎湃 OS (HyperOS) 1 / 2 / 3
            - **产物文件**：
              - AnyKernel3-Xiaomi14-houji-LZ4KD.zip (手机端卡刷包)
              - Image (内核二进制，支持快速热测试打包)
            - **热测试防翻车说明**：
              首次测试强烈建议使用 fastboot boot 命令在 RAM 中临时热启动验证，确认无误再持久刷入！
          files: |
            AnyKernel3-Xiaomi14-houji-LZ4KD.zip
            common/arch/arm64/boot/Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
