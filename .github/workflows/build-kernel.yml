name: Build LZ4KD Universal Kernel Module (Magisk / KSU)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: 安装编译工具链与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev git curl zip unzip python3 gcc-aarch64-linux-gnu dwarves

          if ! sudo apt-get install -y clang-17 lld-17 llvm-17; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 17
            sudo apt-get install -y lld-17 llvm-17
          fi

          sudo ln -sf $(which clang-17) /usr/bin/clang
          sudo ln -sf $(which ld.lld-17) /usr/bin/ld.lld
          sudo ln -sf $(which llvm-ar-17) /usr/bin/llvm-ar
          sudo ln -sf $(which llvm-nm-17) /usr/bin/llvm-nm
          sudo ln -sf $(which llvm-objcopy-17) /usr/bin/llvm-objcopy
          sudo ln -sf $(which llvm-strip-17) /usr/bin/llvm-strip

          clang --version

      - name: 拉取 AOSP GKI 6.1 内核源码树 (锁定 0c3d559bcd85 原厂基线)
        run: |
          echo "Cloning AOSP android14-6.1 at exact commit 0c3d559bcd85..."
          mkdir common && cd common
          git init
          git remote add origin https://android.googlesource.com/kernel/common.git
          git fetch --depth=1 origin 0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
          git checkout FETCH_HEAD
          cd ..

      - name: 注入 LZ4KD 模块代码到内核驱动树
        run: |
          echo "Injecting lz4kd_module into kernel tree..."
          cp -rf lz4kd_module common/crypto/lz4kd
          echo 'obj-m += lz4kd/' >> common/crypto/Makefile

      - name: 准备内核模块编译环境
        run: |
          cd common
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make -j$(nproc) gki_defconfig
          
          # 精确设置版本后缀与配置
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11"/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          
          # 准备模块构建基础设施
          make -j$(nproc) modules_prepare
          cd ..

      - name: 编译 lz4kd.ko 内核模块
        run: |
          cd common
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          echo "Compiling lz4kd.ko module..."
          make -j$(nproc) M=crypto/lz4kd modules

          ls -lh crypto/lz4kd/lz4kd.ko
          cd ..

      - name: 组装 Magisk / KernelSU 通用刷机模块包
        run: |
          echo "Assembling universal module zip..."
          cp common/crypto/lz4kd/lz4kd.ko magisk_template/
          cd magisk_template
          zip -r9 ../LZ4KD-ZRAM-Universal-Module.zip *
          cd ..
          ls -lh LZ4KD-ZRAM-Universal-Module.zip

      - name: 上传模块产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LZ4KD-ZRAM-Universal-Module
          path: |
            LZ4KD-ZRAM-Universal-Module.zip
            common/crypto/lz4kd/lz4kd.ko

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: LZ4KD-Module-${{ github.run_number }}
          name: LZ4KD ZRAM Universal Module Build #${{ github.run_number }}
          body: |
            ## LZ4KD ZRAM 极速内存压缩模块 (Magisk / KernelSU / APatch 通用版)

            - **适配架构**：Android 14 GKI 6.1 通用内核 (高通骁龙 8 Gen 3 等)
            - **特性**：
              - 纯用户态动态挂载（insmod），**完全不碰 boot 分区**
              - **完全不需要关闭 vbmeta 签名**，手机数据 **100% 绝对零风险**
              - 开机自启服务自动挂载驱动并重置接管 ZRAM 为 `[lz4kd]` 模式
            - **安装方法**：
              直接在 Magisk / KernelSU / APatch 界面点击“从本地安装”刷入即可，无需进 Recovery 或 Fastboot！
          files: |
            LZ4KD-ZRAM-Universal-Module.zip
            common/crypto/lz4kd/lz4kd.ko
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
