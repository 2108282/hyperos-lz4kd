name: Build Xiaomi 14 (houji) GKI 6.1 with LZ4KD

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: 安装基础编译依赖与 Clang 17 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev git curl zip unzip python3 gcc-aarch64-linux-gnu dwarves

          # 确保 Clang 17 软链接
          if ! sudo apt-get install -y clang-17 lld-17 llvm-17; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 17
            sudo apt-get install -y lld-17 llvm-17
          fi

          sudo ln -sf $(which clang-17) /usr/bin/clang
          sudo ln -sf $(which ld.lld-17) /usr/bin/ld.lld
          sudo ln -sf $(which llvm-ar-17) /usr/bin/llvm-ar
          sudo ln -sf $(which llvm-nm-17) /usr/bin/llvm-nm
          sudo ln -sf $(which llvm-objcopy-17) /usr/bin/llvm-objcopy
          sudo ln -sf $(which llvm-strip-17) /usr/bin/llvm-strip

          clang --version

      - name: 拉取 AOSP GKI 6.1 内核源码 (锁定 0c3d559bcd85 原厂基线)
        run: |
          echo "Cloning AOSP android14-6.1 at exact commit 0c3d559bcd85..."
          mkdir common && cd common
          git init
          git remote add origin https://android.googlesource.com/kernel/common.git
          git fetch --depth=1 origin 0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
          git checkout FETCH_HEAD
          cd ..

      - name: 注入 LZ4KD 源码与驱动补丁
        run: |
          echo "Injecting LZ4K and LZ4KD source files..."
          cp -rf lz4k_src/include/linux/* common/include/linux/
          cp -rf lz4k_src/lib/* common/lib/
          cp -rf lz4k_src/crypto/* common/crypto/

          echo "Applying LZ4KD patches via python injector..."
          python3 apply_lz4kd.py

      - name: 加载小米 14 原厂 100% 满血配置 (2162项完整底包)
        run: |
          cd common
          # 直接使用从真机提取的原厂满血配置，不再使用残缺的 gki_defconfig
          cp ../xiaomi14_houji_full.config .config
          
          # 精确设置版本后缀，匹配系统内 493 个外置驱动的 vermagic
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11"/g' .config

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          echo "Refreshing config with olddefconfig..."
          make olddefconfig
          cd ..

      - name: 编译满血 GKI 内核 (Image)
        run: |
          cd common
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          echo "Starting full kernel compilation..."
          make -j$(nproc) Image

          ls -lh arch/arm64/boot/Image
          cd ..

      - name: 打包 AnyKernel3 刷机包 (仅限小米14 houji GKI 2.0 规范)
        run: |
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
          cd anykernel
          cp ../anykernel_template.sh ./anykernel.sh
          cp ../common/arch/arm64/boot/Image ./Image
          zip -r9 ../AnyKernel3-Xiaomi14-houji-LZ4KD.zip * -x .git* -x README.md
          cd ..
          ls -lh AnyKernel3-Xiaomi14-houji-LZ4KD.zip

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi14-houji-LZ4KD-Kernel
          path: |
            AnyKernel3-Xiaomi14-houji-LZ4KD.zip
            common/arch/arm64/boot/Image

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: GKI-6.1-LZ4KD-${{ github.run_number }}
          name: Xiaomi 14 (houji) GKI 6.1 LZ4KD Build #${{ github.run_number }}
          body: |
            ## 小米 14 (houji 专用) GKI 6.1 + LZ4KD 满血内核

            - **目标机型**：仅限小米 14 (houji)
            - **配置基底**：100% 继承小米原厂真实运行配置（2162 项），绝非残缺 gki_defconfig
            - **版本号**：精确匹配 6.1.138-android14-11
            - **产物文件**：
              - AnyKernel3-Xiaomi14-houji-LZ4KD.zip (手机端卡刷包)
              - Image (内核二进制)
          files: |
            AnyKernel3-Xiaomi14-houji-LZ4KD.zip
            common/arch/arm64/boot/Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
