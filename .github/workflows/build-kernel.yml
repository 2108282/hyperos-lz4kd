name: Build Xiaomi 14 LZ4KD Kernel from ACK

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'Android Common Kernel Manifest Branch'
        required: true
        default: 'android14-6.1'
      KERNEL_COMMIT:
        description: 'Specific Kernel Commit (Leave empty to use branch HEAD)'
        required: false
        default: '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad'
  push:
    branches:
      - main

jobs:
  build:
    name: Build LZ4KD Kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 16384
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Redirect Cache to High Capacity Partition
        run: |
          echo "[+] Redirecting caches to 90GB+ workspace partition..."
          mkdir -p $GITHUB_WORKSPACE/.cache/bazel
          rm -rf /home/runner/.cache 2>/dev/null || true
          ln -sf $GITHUB_WORKSPACE/.cache /home/runner/.cache
          df -h

      - name: Download Kernel Source via Repo
        run: |
          sudo apt-get remove firefox -y 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y repo ccache git zip unzip python3
          cd $GITHUB_WORKSPACE
          git config --global user.name "KernelBuilder"
          git config --global user.email "builder@kernel.local"
          mkdir -p android-kernel && cd android-kernel

          TARGET_TAG="${{ github.event.inputs.TAG || 'android14-6.1' }}"
          echo "[+] Initializing repo with branch: common-$TARGET_TAG"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "common-$TARGET_TAG" --repo-rev=v2.16
          repo --trace sync -c -j$(nproc --all) --no-tags

          TARGET_COMMIT="${{ github.event.inputs.KERNEL_COMMIT || '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad' }}"
          if [ -n "$TARGET_COMMIT" ]; then
            echo "[+] Pinning common repo to exact commit: $TARGET_COMMIT"
            cd common
            git fetch --depth=1 https://android.googlesource.com/kernel/common "$TARGET_COMMIT"
            git checkout FETCH_HEAD
            cd ..
          fi

      - name: Inject LZ4KD Algorithm
        run: |
          echo "[+] Injecting LZ4KD into ACK tree..."
          GKI_ROOT=$GITHUB_WORKSPACE/android-kernel
          LZ4KD_SRC=$GITHUB_WORKSPACE/lz4kd_module

          ls -la $LZ4KD_SRC/
          mkdir -p $GKI_ROOT/common/crypto/lz4kd
          cp -rf $LZ4KD_SRC/* $GKI_ROOT/common/crypto/lz4kd/
          cp -rf $LZ4KD_SRC/include/linux/* $GKI_ROOT/common/include/linux/

          DRIVER_MAKEFILE=$GKI_ROOT/common/crypto/Makefile
          DRIVER_KCONFIG=$GKI_ROOT/common/crypto/Kconfig
          grep -q "lz4kd" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_CRYPTO_LZ4KD) += lz4kd/\n" >> "$DRIVER_MAKEFILE"
          grep -q "lz4kd" "$DRIVER_KCONFIG" || sed -i '/endmenu/i\source "crypto/lz4kd/Kconfig"' "$DRIVER_KCONFIG"

          # 注册 lz4kd 到 ZRAM 原生静态菜单 backends[] 列表 (让 Scene 等工具直接在列表中识别到 lz4kd)
          python3 -c '
          zcomp_file = "'$GKI_ROOT'/common/drivers/block/zram/zcomp.c"
          with open(zcomp_file, "r") as f:
              content = f.read()
          target = """#if IS_ENABLED(CONFIG_CRYPTO_ZSTD)\n\t\"zstd\",\n#endif"""
          replacement = target + """\n#if IS_ENABLED(CONFIG_CRYPTO_LZ4KD)\n\t\"lz4kd\",\n#endif"""
          if target in content and "CONFIG_CRYPTO_LZ4KD" not in content:
              content = content.replace(target, replacement, 1)
              with open(zcomp_file, "w") as f:
                  f.write(content)
              print("[+] Successfully registered lz4kd into zcomp.c backends[]")
          '

          # 兼容性修复: 避免 glibc 2.38 上的 resolve_btfids 问题 (对标 YukongA 原版)
          if [ ! -e $GKI_ROOT/build/build.sh ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              cd $GKI_ROOT/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || true
            fi
          fi

      - name: Symbol and ABI Protection Removal
        working-directory: android-kernel
        run: |
          echo "[+] Removing protected exports to support OEM vendor modules (YukongA standard)"
          rm -f common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          sed -i '/^[[:space:]]*"protected_exports_list"/d' common/BUILD.bazel 2>/dev/null || true

      - name: Clean Working Directory to Avoid -dirty Version
        working-directory: android-kernel
        run: |
          cd common
          git add -A
          git commit -a -m "Add LZ4KD compression algorithm" || true

      - name: Build ACK Kernel Image
        working-directory: android-kernel
        run: |
          if [ -e build/build.sh ]; then
            echo "[+] Building with build/build.sh"
            BUILD_BOOT_IMG=1 SKIP_VENDOR_BOOT=1 KERNEL_BINARY=Image AVB_SIGN_BOOT_IMG=1 AVB_BOOT_PARTITION_SIZE=$((64*1024*1024)) AVB_BOOT_ALGORITHM=SHA256_RSA2048 AVB_BOOT_KEY=prebuilts/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem BOOT_IMAGE_HEADER_VERSION=4 LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"
          else
            echo "[+] Building with Kleaf / Bazel"
            tools/bazel run --cache_dir=$GITHUB_WORKSPACE/.cache/bazel --config=fast --config=stamp --lto=thin //common:kernel_aarch64_dist -- --dist_dir=dist
          fi

      - name: Package AnyKernel3 Flashable Zip
        run: |
          OUTDIR=android-kernel/out/*/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          echo "[+] Found build dist dir: $OUTDIR"
          ls -lh $OUTDIR/

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          # 针对高通骁龙 8 Gen 3 纯 64 位平台替换 AArch64 工具链 (彻底消除 Busybox setup failed)
          cp -f tools_arm64/busybox AnyKernel3/tools/busybox
          cp -f tools_arm64/magiskboot AnyKernel3/tools/magiskboot
          cp -f tools_arm64/magiskpolicy AnyKernel3/tools/magiskpolicy
          chmod 755 AnyKernel3/tools/*

          # 写入适配小米 14 (houji) 的 GKI AnyKernel3 引导配置
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 14 LZ4KD Kernel (GKI 6.1)/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=houji/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=shennong/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=gki_aarch64/g' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/dump_boot;/split_boot;\nflash_boot;/g' AnyKernel3/anykernel.sh
          sed -i '/backup_file init.rc/,$d' AnyKernel3/anykernel.sh

          cp $OUTDIR/Image AnyKernel3/Image

          cd AnyKernel3
          zip -r9 ../AnyKernel3_Xiaomi14_LZ4KD.zip *
          cd ..
          ls -lh AnyKernel3_Xiaomi14_LZ4KD.zip

      - name: Package LZ4KD ZRAM Driver Module
        run: |
          OUTDIR=android-kernel/out/*/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi

          echo "[+] Looking for compiled zram.ko in $OUTDIR..."
          ZRAM_KO=$(find $OUTDIR -name "zram.ko" | head -n 1)
          if [ -z "$ZRAM_KO" ] || [ ! -f "$ZRAM_KO" ]; then
            echo "[-] ERROR: zram.ko was not found in $OUTDIR"
            ls -la $OUTDIR
            exit 1
          fi

          echo "[+] Found zram.ko at: $ZRAM_KO"
          ls -la "$ZRAM_KO"

          MODULE_BUILD_DIR=lz4kd_driver_module
          rm -rf "$MODULE_BUILD_DIR"
          mkdir -p "$MODULE_BUILD_DIR/META-INF/com/google/android"

          cat << 'EOF' > "$MODULE_BUILD_DIR/module.prop"
id=xiaomi14_lz4kd_zram
name=小米14 LZ4KD ZRAM 驱动模块
version=v1.0
versionCode=100
author=YukongA & PairDev
description=为小米 14 (HyperOS / Android 14 GKI 6.1) 提供包含 LZ4KD 原生菜单支持的 ZRAM 核心驱动，Scene 可直接识别并接管。
EOF

          cat << 'EOF' > "$MODULE_BUILD_DIR/META-INF/com/google/android/updater-script"
#MAGISK
EOF

          cat << 'EOF' > "$MODULE_BUILD_DIR/META-INF/com/google/android/update-binary"
#!/sbin/sh
OUTFD=$2
ZIPFILE=$3

ui_print() {
  echo -e "ui_print $1\nui_print" > /proc/self/fd/$OUTFD
}

ui_print "************************************"
ui_print "*   小米 14 LZ4KD ZRAM 驱动模块    *"
ui_print "*   适配 Android 14 GKI 6.1 内核   *"
ui_print "************************************"

MODDIR="${0%/*}"
if [ -z "$MODPATH" ]; then
  MODPATH="/data/adb/modules/xiaomi14_lz4kd_zram"
fi

rm -rf "$MODPATH"
mkdir -p "$MODPATH"
unzip -o "$ZIPFILE" -d "$MODPATH" "system_dlkm/*" "module.prop" >&2

chmod -R 755 "$MODPATH"
find "$MODPATH" -type f -exec chmod 644 {} +

ui_print "- 正在部署同源编译的 LZ4KD ZRAM 核心驱动..."
ui_print "- 驱动原生包含 lz4kd 菜单项"
ui_print "- 安装完成！请重启手机，开机后 Scene 下拉菜单即可直接选择 lz4kd。"
exit 0
EOF
          chmod 755 "$MODULE_BUILD_DIR/META-INF/com/google/android/update-binary"

          TARGET_DIR1="$MODULE_BUILD_DIR/system_dlkm/flatten/lib/modules"
          TARGET_DIR2="$MODULE_BUILD_DIR/system_dlkm/lib/modules/6.1.138-android14-11-g0c3d559bcd85-ab14529422/kernel/drivers/block/zram"

          mkdir -p "$TARGET_DIR1"
          mkdir -p "$TARGET_DIR2"

          cp -f "$ZRAM_KO" "$TARGET_DIR1/zram.ko"
          cp -f "$ZRAM_KO" "$TARGET_DIR2/zram.ko"

          cd "$MODULE_BUILD_DIR"
          zip -r9 ../LZ4KD_ZRAM_Driver_Module.zip *
          cd ..

          ls -lh LZ4KD_ZRAM_Driver_Module.zip
          echo "[+] LZ4KD_ZRAM_Driver_Module.zip packaged successfully!"

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_Xiaomi14_LZ4KD
          path: AnyKernel3_Xiaomi14_LZ4KD.zip

      - name: Upload Raw Kernel Image & Boot
        uses: actions/upload-artifact@v4
        with:
          name: Raw_Kernel_and_Boot
          path: |
            android-kernel/dist/Image
            android-kernel/dist/boot.img
            android-kernel/dist/zram.ko

      - name: Upload LZ4KD ZRAM Driver Module
        uses: actions/upload-artifact@v4
        with:
          name: LZ4KD_ZRAM_Driver_Module
          path: LZ4KD_ZRAM_Driver_Module.zip
