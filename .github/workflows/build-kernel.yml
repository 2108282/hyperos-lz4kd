name: Build Xiaomi 14 GKI 6.1 LZ4KD Kernel & AnyKernel3

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: 'AOSP GKI 6.1 Commit Hash (Default: 0c3d559bcd85)'
        required: true
        default: '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad'
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: 安装编译工具链与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev git curl zip unzip python3 gcc-aarch64-linux-gnu dwarves

          if ! sudo apt-get install -y clang-17 lld-17 llvm-17; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 17
            sudo apt-get install -y lld-17 llvm-17
          fi

          sudo ln -sf $(which clang-17) /usr/bin/clang
          sudo ln -sf $(which ld.lld-17) /usr/bin/ld.lld
          sudo ln -sf $(which llvm-ar-17) /usr/bin/llvm-ar
          sudo ln -sf $(which llvm-nm-17) /usr/bin/llvm-nm
          sudo ln -sf $(which llvm-objcopy-17) /usr/bin/llvm-objcopy
          sudo ln -sf $(which llvm-strip-17) /usr/bin/llvm-strip

          clang --version

      - name: 拉取 AOSP GKI 6.1 源码树 (锁定 0c3d559bcd85 原厂基线)
        run: |
          TARGET_COMMIT="${{ github.event.inputs.kernel_commit || '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad' }}"
          echo "Cloning AOSP android14-6.1 at commit: $TARGET_COMMIT"
          mkdir -p kernel_workspace && cd kernel_workspace
          git init common
          cd common
          git remote add origin https://android.googlesource.com/kernel/common.git
          git fetch --depth=1 origin "$TARGET_COMMIT"
          git checkout FETCH_HEAD
          cd ../..

      - name: 注入 LZ4KD 算法与配置到内核驱动树
        run: |
          echo "Injecting LZ4KD module into common/crypto/lz4kd..."
          mkdir -p kernel_workspace/common/crypto/lz4kd
          cp -rf lz4kd_module/* kernel_workspace/common/crypto/lz4kd/
          cp -rf lz4kd_module/include/linux/* kernel_workspace/common/include/linux/

          echo 'obj-$(CONFIG_CRYPTO_LZ4KD) += lz4kd/' >> kernel_workspace/common/crypto/Makefile

          # 注册 Kconfig
          sed -i '/endmenu/i source "crypto/lz4kd/Kconfig"' kernel_workspace/common/crypto/Kconfig

          # 在 gki_defconfig 中开启内置编译
          echo "CONFIG_CRYPTO_LZ4KD=y" >> kernel_workspace/common/arch/arm64/configs/gki_defconfig

          # 关键兼容性适配: 保留全量符号导出，确保厂商 400+ 驱动 100% 能够加载
          rm -f kernel_workspace/common/android/abi_gki_protected_exports_* || true
          sed -i '/^[[:space:]]*"protected_exports_list"/d' kernel_workspace/common/BUILD.bazel 2>/dev/null || true

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11"/g' kernel_workspace/common/arch/arm64/configs/gki_defconfig
          sed -i 's/CONFIG_TRIM_UNUSED_KSYMS=y/CONFIG_TRIM_UNUSED_KSYMS=n/g' kernel_workspace/common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TRIM_UNUSED_KSYMS=n" >> kernel_workspace/common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_UNUSED_KSYMS_WHITELIST=""' >> kernel_workspace/common/arch/arm64/configs/gki_defconfig

          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' kernel_workspace/common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEBUG_INFO_BTF=n" >> kernel_workspace/common/arch/arm64/configs/gki_defconfig

      - name: 编译 GKI 内核 Image
        run: |
          cd kernel_workspace/common
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make -j$(nproc) gki_defconfig
          make -j$(nproc) Image

          ls -lh arch/arm64/boot/Image
          cd ../..

      - name: 打包 AnyKernel3 刷机包 (TWRP / Recovery 原地修补包)
        run: |
          echo "Cloning AnyKernel3 and creating flashable zip..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          
          # 配置 anykernel.sh
          cat << 'AK_EOF' > anykernel3/anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

properties() { '
kernel.string=LZ4KD Kernel for Xiaomi 14 (houji)
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=houji
device.name2=shennong
device.name3=gki_aarch64
supported.versions=14, 15
supported.patchlevels=
'; }

block=boot;
is_slot_device=auto;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

. tools/ak3-core.sh;

split_boot;
flash_boot;
AK_EOF

          cp kernel_workspace/common/arch/arm64/boot/Image anykernel3/Image
          rm -rf anykernel3/.git* anykernel3/README.md

          cd anykernel3
          zip -r9 ../AnyKernel3_Xiaomi14_LZ4KD.zip *
          cd ..
          ls -lh AnyKernel3_Xiaomi14_LZ4KD.zip

      - name: 上传编译产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi14-LZ4KD-Kernel
          path: |
            AnyKernel3_Xiaomi14_LZ4KD.zip
            kernel_workspace/common/arch/arm64/boot/Image

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: Xiaomi14-LZ4KD-v${{ github.run_number }}
          name: Xiaomi 14 GKI 6.1 LZ4KD Build #${{ github.run_number }}
          body: |
            ## 小米 14 (houji) GKI 6.1 LZ4KD 内存压缩内核

            - **基线版本**：`Linux 6.1.138` (Commit `0c3d559bcd85`)
            - **特性**：
              - 内置华为专有 **LZ4KD (LZ4K 4KB + Delta 跨页差分)** 压缩算法
              - 完整支持 Linux 6.1 `scomp` 同步压缩接口
              - 全量保留高通 8 Gen 3 硬件驱动符号，彻底杜绝 Hard Fault 重启
              - 输出 AnyKernel3 格式，原地修补 boot 分区，**100% 完整保留原有 TWRP**
            - **使用方式**：
              1. 手机进入 TWRP Recovery；
              2. 在【安装】中选择 `AnyKernel3_Xiaomi14_LZ4KD.zip` 滑动刷入；
              3. 重启进入系统；
              4. 用户可在终端执行 `echo lz4kd > /sys/block/zram0/comp_algorithm` 自行开启。
          files: |
            AnyKernel3_Xiaomi14_LZ4KD.zip
            kernel_workspace/common/arch/arm64/boot/Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
