name: Build Xiaomi 14 LZ4KD Kernel from ACK

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'Android Common Kernel Manifest Branch'
        required: true
        default: 'android14-6.1'
      KERNEL_COMMIT:
        description: 'Specific Kernel Commit (Leave empty to use branch HEAD)'
        required: false
        default: '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad'
  push:
    branches:
      - main

jobs:
  build:
    name: Build LZ4KD Kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Download Kernel Source via Repo
        run: |
          sudo apt-get remove firefox -y 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y repo ccache git zip unzip python3
          cd $GITHUB_WORKSPACE
          git config --global user.name "KernelBuilder"
          git config --global user.email "builder@kernel.local"
          mkdir -p android-kernel && cd android-kernel

          TARGET_TAG="${{ github.event.inputs.TAG || 'android14-6.1' }}"
          echo "[+] Initializing repo with branch: common-$TARGET_TAG"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "common-$TARGET_TAG" --repo-rev=v2.16
          repo --trace sync -c -j$(nproc --all) --no-tags

          TARGET_COMMIT="${{ github.event.inputs.KERNEL_COMMIT || '0c3d559bcd85c64dae9c9c9687abbe5347fff3ad' }}"
          if [ -n "$TARGET_COMMIT" ]; then
            echo "[+] Pinning common repo to exact commit: $TARGET_COMMIT"
            cd common
            git fetch --depth=1 origin "$TARGET_COMMIT" || true
            git checkout "$TARGET_COMMIT" || true
            cd ..
          fi

      - name: Inject LZ4KD Algorithm
        run: |
          echo "[+] Injecting LZ4KD into ACK tree..."
          GKI_ROOT=$GITHUB_WORKSPACE/android-kernel
          LZ4KD_SRC=$GITHUB_WORKSPACE/lz4kd_module

          mkdir -p $GKI_ROOT/common/crypto/lz4kd
          cp -rf $LZ4KD_SRC/* $GKI_ROOT/common/crypto/lz4kd/
          cp -rf $LZ4KD_SRC/include/linux/* $GKI_ROOT/common/include/linux/

          DRIVER_MAKEFILE=$GKI_ROOT/common/crypto/Makefile
          DRIVER_KCONFIG=$GKI_ROOT/common/crypto/Kconfig
          grep -q "lz4kd" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_CRYPTO_LZ4KD) += lz4kd/\n" >> "$DRIVER_MAKEFILE"
          grep -q "lz4kd" "$DRIVER_KCONFIG" || sed -i '/endmenu/i\source "crypto/lz4kd/Kconfig"' "$DRIVER_KCONFIG"

          # 开启内置配置
          GKI_DEFCONFIG=$GKI_ROOT/common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYPTO_LZ4KD=y" >> $GKI_DEFCONFIG

          # 兼容性修复: 避免 glibc 2.38 上的 resolve_btfids 问题
          if [ ! -e $GKI_ROOT/build/build.sh ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              cd $GKI_ROOT/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || true
            fi
          fi

      - name: Symbol and ABI Protection Removal
        working-directory: android-kernel
        run: |
          echo "[+] Removing protected exports to support OEM vendor modules"
          rm -f common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          sed -i '/^[[:space:]]*"protected_exports_list"/d' common/BUILD.bazel 2>/dev/null || true

          # 确保不裁剪符号，导出全量符号给高通外置驱动
          echo "CONFIG_TRIM_UNUSED_KSYMS=n" >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_UNUSED_KSYMS_WHITELIST=""' >> common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEBUG_INFO_BTF=n" >> common/arch/arm64/configs/gki_defconfig

      - name: Clean Working Directory to Avoid -dirty Version
        working-directory: android-kernel
        run: |
          cd common
          git add -A
          git commit -a -m "Add LZ4KD compression algorithm" || true

      - name: Build ACK Kernel Image
        working-directory: android-kernel
        run: |
          if [ -e build/build.sh ]; then
            echo "[+] Building with build/build.sh"
            BUILD_BOOT_IMG=1 SKIP_VENDOR_BOOT=1 KERNEL_BINARY=Image AVB_SIGN_BOOT_IMG=1 AVB_BOOT_PARTITION_SIZE=$((64*1024*1024)) AVB_BOOT_ALGORITHM=SHA256_RSA2048 AVB_BOOT_KEY=prebuilts/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem BOOT_IMAGE_HEADER_VERSION=4 LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || echo "COMPILE_KERNEL=false" >>$GITHUB_ENV
          else
            echo "[+] Building with Kleaf / Bazel"
            tools/bazel run --cache_dir=/home/runner/.cache/bazel --config=fast --config=stamp --lto=thin //common:kernel_aarch64_dist -- --dist_dir=dist || echo "COMPILE_KERNEL=false" >>$GITHUB_ENV
          fi

      - name: Package AnyKernel3 Flashable Zip
        run: |
          OUTDIR=android-kernel/out/*/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          echo "[+] Found build dist dir: $OUTDIR"
          ls -lh $OUTDIR/

          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          # 针对小米 14 (houji) 和通用 GKI 设备进行配置
          sed -i 's/device.name1=.*/device.name1=houji/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=shennong/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=gki_aarch64/g' AnyKernel3/anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 14 LZ4KD Kernel/g' AnyKernel3/anykernel.sh

          cp $OUTDIR/Image AnyKernel3/Image

          cd AnyKernel3
          zip -r9 ../AnyKernel3_Xiaomi14_LZ4KD.zip *
          cd ..
          ls -lh AnyKernel3_Xiaomi14_LZ4KD.zip

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_Xiaomi14_LZ4KD
          path: AnyKernel3_Xiaomi14_LZ4KD.zip

      - name: Upload Raw Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image
          path: AnyKernel3/Image
